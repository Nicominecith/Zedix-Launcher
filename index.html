<head>

    <style>
        :root {
            --bg-color: #07090e;
            --bg-card: rgba(13, 17, 26, 0.7);
            --card-border: rgba(0, 240, 255, 0.18);
            --mc-diamond: #00f0ff;
            --mc-emerald: #55ff55;
            --mc-gold: #ffaa00;
            --glow-color: rgba(0, 240, 255, 0.4);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --font-pixel: 'Pixelify Sans', sans-serif;
            --font-title: 'Archivo Black', sans-serif;
            --font-body: 'Poppins', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* --- BACKGROUND GLOW ORBS & MESH GRID --- */
        .bg-glow-orb-1 {
            position: fixed;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.22) 0%, rgba(0, 119, 255, 0.05) 60%, transparent 80%);
            filter: blur(100px);
            z-index: -2;
            pointer-events: none;
            animation: orbPulse 8s ease-in-out infinite alternate;
        }

        .bg-glow-orb-2 {
            position: fixed;
            bottom: -200px;
            right: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.15) 0%, transparent 70%);
            filter: blur(120px);
            z-index: -2;
            pointer-events: none;
        }

        @keyframes orbPulse {
            0% { transform: translateX(-50%) scale(0.9); opacity: 0.6; }
            100% { transform: translateX(-50%) scale(1.1); opacity: 0.9; }
        }

        .scanlines {
            position: fixed;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.25) 50%,
                rgba(0, 0, 0, 0.25)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
            opacity: 0.4;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -3;
            animation: gridMove 35s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* Pixel Floating Particles */
        .pixel-particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: var(--mc-diamond);
            box-shadow: 0 0 10px var(--mc-diamond);
            opacity: 0.6;
            animation: floatUp 10s linear infinite;
            border-radius: 1px;
        }

        .particle:nth-child(2n) { background: var(--mc-emerald); box-shadow: 0 0 10px var(--mc-emerald); animation-duration: 7s; }
        .particle:nth-child(3n) { background: var(--mc-gold); box-shadow: 0 0 10px var(--mc-gold); animation-duration: 12s; }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* --- HEADER & GLASS HUD TOP BAR --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 8%;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            background: rgba(7, 9, 14, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .brand:hover {
            transform: scale(1.03);
        }

        .brand-logo-img {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            border: 2px solid var(--mc-diamond);
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.5);
        }

        .logo {
            font-family: var(--font-pixel);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .text-gradient {
            background: linear-gradient(135deg, var(--mc-diamond), #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* LIVE HUD MONITOR BAR */
        .hud-monitor {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--card-border);
            padding: 8px 20px;
            border-radius: 999px;
            font-family: var(--font-pixel);
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.08);
        }

        .hud-stat {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
        }

        .hud-stat span {
            color: var(--mc-emerald);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--mc-emerald);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--mc-emerald);
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .nav-links {
            display: flex;
            gap: 10px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-family: var(--font-pixel);
            font-size: 1rem;
            transition: all 0.25s ease;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: rgba(0, 0, 0, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a:hover {
            color: #ffffff;
            border-color: var(--mc-diamond);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
            background: rgba(0, 240, 255, 0.1);
            transform: translateY(-2px);
        }

        /* --- PAGE SWITCHING SYSTEM --- */
        .page-section {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .page-section.active {
            display: block;
            opacity: 1;
        }

        /* --- HERO SECTION --- */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 50px 20px 20px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .hero h1 {
            font-family: var(--font-pixel);
            font-size: 3.6rem;
            line-height: 1.1;
            margin-bottom: 18px;
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.35);
        }

        .hero .subtitle {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            max-width: 720px;
            line-height: 1.6;
            background: rgba(13, 17, 26, 0.6);
            backdrop-filter: blur(12px);
            padding: 16px 26px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* BORDER BEAM CTA BUTTON */
        .center-cta-wrapper {
            position: relative;
            margin: 10px 0 30px 0;
            padding: 2px;
            border-radius: 14px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
        }

        .center-cta-wrapper::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: conic-gradient(
                transparent 0deg,
                transparent 280deg,
                var(--mc-diamond) 340deg,
                #ffffff 360deg
            );
            animation: rotateBeam 4s linear infinite;
            z-index: 0;
        }

        @keyframes rotateBeam {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-mc-primary {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #0088cc 0%, #004499 100%);
            color: #ffffff;
            font-family: var(--font-pixel);
            font-size: 1.35rem;
            text-decoration: none;
            padding: 18px 38px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.25s ease;
            user-select: none;
        }

        .btn-mc-primary:hover {
            background: linear-gradient(135deg, #00aaff 0%, #0066cc 100%);
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.6);
        }

        /* GLASS HUD CARDS */
        .hud-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        /* --- DYNAMIC SHOWCASE SECTION --- */
        .showcase-section {
            width: 100%;
            max-width: 1200px;
            margin: 40px auto 70px auto;
            padding: 0 20px;
        }

        .showcase-grid {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 40px;
            align-items: center;
            padding: 40px;
            background: rgba(10, 14, 23, 0.75);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 30px rgba(0, 240, 255, 0.05);
        }

        .showcase-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .showcase-tag {
            font-family: var(--font-pixel);
            font-size: 1rem;
            color: var(--mc-diamond);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .showcase-title {
            font-family: var(--font-pixel);
            font-size: 2.8rem;
            line-height: 1.15;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .showcase-desc {
            font-size: 0.98rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 30px;
            min-height: 85px;
        }

        /* Dynamic Pill Nav Buttons */
        .showcase-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--card-border);
        }

        .pill-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-pixel);
            font-size: 0.95rem;
            padding: 8px 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pill-btn .dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            transition: all 0.25s ease;
        }

        .pill-btn:hover {
            color: #ffffff;
        }

        .pill-btn.active {
            background: rgba(0, 240, 255, 0.15);
            color: var(--mc-diamond);
            border: 1px solid var(--mc-diamond);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .pill-btn.active .dot {
            background: var(--mc-diamond);
            box-shadow: 0 0 8px var(--mc-diamond);
        }

        /* Screenshot Preview Frame */
        .showcase-frame {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.2);
            background: #000000;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .showcase-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.35s ease, transform 0.35s ease;
            opacity: 1;
            transform: scale(1);
        }

        .showcase-frame img.fading {
            opacity: 0;
            transform: scale(0.97);
        }

        /* DOWNLOAD BUTTONS */
        .download-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .os-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-os {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 24px;
            border-radius: 10px;
            font-family: var(--font-pixel);
            font-size: 1.05rem;
            text-decoration: none;
            transition: all 0.25s ease;
            cursor: pointer;
            border: 1px solid var(--card-border);
            background: rgba(0, 0, 0, 0.5);
            color: var(--text-main);
            backdrop-filter: blur(8px);
        }

        .btn-os:hover {
            border-color: var(--mc-diamond);
            background: rgba(0, 240, 255, 0.15);
            transform: translateY(-3px);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.3);
        }

        .btn-os.btn-win {
            border-color: var(--mc-diamond);
            background: rgba(0, 119, 255, 0.2);
        }

        /* --- VERSIONS PAGE --- */
        .versions-section {
            max-width: 950px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }

        .section-title {
            font-family: var(--font-pixel);
            font-size: 2.8rem;
            margin-bottom: 35px;
            text-align: center;
        }

        .version-card {
            padding: 32px;
            margin-bottom: 30px;
        }

        .version-card.latest {
            border-color: var(--mc-diamond);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.22);
        }

        .version-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px dashed var(--card-border);
            padding-bottom: 16px;
        }

        .version-title-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .version-card h3 {
            font-family: var(--font-pixel);
            font-size: 1.9rem;
            color: var(--mc-diamond);
        }

        .badge-latest {
            background: var(--mc-emerald);
            color: #000000;
            padding: 4px 12px;
            border-radius: 6px;
            font-family: var(--font-pixel);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .version-changelog {
            list-style: none;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .version-changelog li {
            color: var(--text-muted);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .version-changelog li i {
            color: var(--mc-emerald);
        }

        .version-downloads h4 {
            font-family: var(--font-pixel);
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 14px;
        }

        footer {
            text-align: center;
            padding: 26px;
            border-top: 1px solid var(--card-border);
            color: var(--text-muted);
            font-family: var(--font-pixel);
            font-size: 0.9rem;
            background: rgba(5, 7, 10, 0.9);
            backdrop-filter: blur(10px);
        }

                grid-template-columns: 1fr;
                padding: Understood — switching to English! How can I help you today?
