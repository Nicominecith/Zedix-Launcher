<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zedix Launcher - Showcase Section</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #05080e;
            --card-bg: rgba(12, 17, 29, 0.65);
            --card-border: rgba(0, 240, 255, 0.2);
            --accent-cyan: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.35);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --font-pixel: 'Pixelify Sans', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        /* --- SHOWCASE CARD CONTAINER --- */
        .showcase-card {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            gap: 40px;
            align-items: center;
            position: relative;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px rgba(255, 255, 255, 0.1),
                0 0 40px rgba(0, 240, 255, 0.08);
            transition: border-color 0.3s ease;
        }

        .showcase-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0.8;
        }

        /* --- LEFT CONTENT PANEL --- */
        .content-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 320px;
        }

        .tag-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-pixel);
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .tag-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
            border-radius: 1px;
        }

        .showcase-title {
            font-family: var(--font-pixel);
            font-size: 2.8rem;
            line-height: 1.1;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .showcase-description {
            font-size: 0.95rem;
            line-height: 1.65;
            color: var(--text-muted);
            margin-bottom: 30px;
            min-height: 80px;
            transition: opacity 0.25s ease;
        }

        /* --- NAVIGATION PILLS --- */
        .pill-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(0, 0, 0, 0.35);
            padding: 8px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: fit-content;
        }

        .pill-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-family: var(--font-pixel);
            font-size: 0.95rem;
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pill-btn .dot {
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: all 0.25s ease;
        }

        .pill-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
        }

        .pill-btn.active {
            background: rgba(0, 240, 255, 0.12);
            color: var(--accent-cyan);
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .pill-btn.active .dot {
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        /* --- RIGHT PREVIEW FRAME --- */
        .preview-window {
            background: rgba(5, 8, 14, 0.9);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(0, 240, 255, 0.1);
            aspect-ratio: 16 / 10;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Mock Window Header */
        .window-header {
            background: rgba(15, 22, 36, 0.8);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .window-dots {
            display: flex;
            gap: 6px;
        }

        .dot-btn {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-close { background: #ff5f56; }
        .dot-min { background: #ffbd2e; }
        .dot-max { background: #27c93f; }

        .window-title {
            font-family: var(--font-pixel);
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .window-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, rgba(0, 240, 255, 0.05) 0%, transparent 70%);
        }

        .preview-content {
            text-align: center;
            transition: all 0.3s ease;
            opacity: 1;
            transform: scale(1);
        }

        .preview-content.fade {
            opacity: 0;
            transform: scale(0.95);
        }

        .preview-icon {
            font-size: 3rem;
            color: var(--accent-cyan);
            margin-bottom: 12px;
            filter: drop-shadow(0 0 12px var(--accent-glow));
        }

        .preview-label {
            font-family: var(--font-pixel);
            font-size: 1.2rem;
            color: var(--text-main);
        }

        /* Grid scanlines overlay on preview */
        .scanlines {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.3) 51%);
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.6;
        }

        @media (max-width: 850px) {
            .showcase-card {
                grid-template-columns: 1fr;
                padding: 24px;
            }
            .showcase-title {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="showcase-card">
        <!-- Left Panel: Texts & Pill Tabs -->
        <div class="content-panel">
            <div>
                <div class="tag-badge" id="tab-tag">Home</div>
                <h2 class="showcase-title" id="tab-title">Your launcher.<br>At a glance.</h2>
                <p class="showcase-description" id="tab-desc">
                    Direct overview of all your Minecraft instances (e.g., Fabulously Optimized, AxolotlClient, VerityPack), Microsoft account status, cape selector, Java Realms news, and integrated friends list.
                </p>
            </div>

            <div class="pill-nav">
                <button class="pill-btn active" onclick="switchTab('home', this)">
                    <span class="dot"></span> Home
                </button>
                <button class="pill-btn" onclick="switchTab('mods', this)">
                    <span class="dot"></span> Mods
                </button>
                <button class="pill-btn" onclick="switchTab('network', this)">
                    <span class="dot"></span> Network
                </button>
                <button class="pill-btn" onclick="switchTab('settings', this)">
                    <span class="dot"></span> Settings
                </button>
            </div>
        </div>

        <!-- Right Panel: Mock Window Frame -->
        <div class="preview-window">
            <div class="window-header">
                <div class="window-dots">
                    <span class="dot-btn dot-close"></span>
                    <span class="dot-btn dot-min"></span>
                    <span class="dot-btn dot-max"></span>
                </div>
                <span class="window-title" id="window-status">Zedix Launcher — Home</span>
                <div style="width: 38px;"></div>
            </div>
            
            <div class="window-body">
                <div class="scanlines"></div>
                <div class="preview-content" id="preview-box">
                    <i class="fa-solid fa-house-laptop preview-icon"></i>
                    <div class="preview-label">Instance Dashboard & News</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tabData = {
            home: {
                tag: "Home",
                title: "Your launcher.<br>At a glance.",
                desc: "Direct overview of all your Minecraft instances (e.g., Fabulously Optimized, AxolotlClient, VerityPack), Microsoft account status, cape selector, Java Realms news, and integrated friends list.",
                icon: "fa-solid fa-house-laptop",
                label: "Instance Dashboard & News"
            },
            mods: {
                tag: "Mods",
                title: "Instant mod<br>management.",
                desc: "Search, update, and toggle your Fabric, Forge, or NeoForge mods directly inside the client without touching your .minecraft folder.",
                icon: "fa-solid fa-cubes-stacked",
                label: "Modpack & Dependency Manager"
            },
            network: {
                tag: "Network",
                title: "Stay connected<br>with friends.",
                desc: "See who's online, send party invites, join multiplayer servers together with one click, and check live server status alerts.",
                icon: "fa-solid fa-network-wired",
                label: "Live Friends & Server Network"
            },
            settings: {
                tag: "Settings",
                title: "Full control over<br>performance.",
                desc: "Tune your Java RAM allocation, custom JVM arguments, display resolution, client themes, and auto-update preferences effortlessly.",
                icon: "fa-solid fa-sliders",
                label: "System & Java Configuration"
            }
        };

        function switchTab(key, btn) {
            // Update active pill button
            document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const data = tabData[key];
            const previewBox = document.getElementById('preview-box');
            const tabDesc = document.getElementById('tab-desc');

            // Quick fade effect
            previewBox.classList.add('fade');
            tabDesc.style.opacity = '0';

            setTimeout(() => {
                document.getElementById('tab-tag').innerText = data.tag;
                document.getElementById('tab-title').innerHTML = data.title;
                tabDesc.innerText = data.desc;
                document.getElementById('window-status').innerText = `Zedix Launcher — ${data.tag}`;

                previewBox.innerHTML = `
                    <i class="${data.icon} preview-icon"></i>
                    <div class="preview-label">${data.label}</div>
                `;

                previewBox.classList.remove('fade');
                tabDesc.style.opacity = '1';
            }, 180);
        }
    </script>
</body>
</html>
