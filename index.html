<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern NRC Style Landing Page</title>
  <style>
    :root {
      --bg: #0d0e12;
      --card-bg: rgba(20, 22, 31, 0.75);
      --accent: #a78bfa;
      --accent-glow: rgba(167, 139, 250, 0.35);
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Pulsierender Hintergrund-Glow */
    .bg-glow {
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
      filter: blur(90px);
      z-index: -1;
      animation: pulse 8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulse {
      0% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.85); }
      100% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.15); }
    }

    /* Hero Bereich */
    .hero {
      text-align: center;
      padding: 120px 20px 40px;
      max-width: 800px;
      animation: fadeIn 1s ease-out;
    }

    .hero h1 {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.2rem;
    }

    .hero p {
      color: #9ca3af;
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    /* Button Style mit Glow-Hover */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #7c3aed;
      color: #ffffff;
      padding: 14px 32px;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
    }

    .btn-primary:hover {
      background: #6d28d9;
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(167, 139, 250, 0.7);
    }

    /* Border Beam Animation Card */
    .card-container {
      position: relative;
      width: 90%;
      max-width: 1000px;
      margin: 40px auto 80px;
      border-radius: 20px;
      padding: 2px;
      overflow: hidden;
      background: var(--border-color);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* Rotierender Lichtstrahl */
    .card-container::before {
      content: '';
      position: absolute;
      width: 150%;
      height: 150%;
      top: -25%;
      left: -25%;
      background: conic-gradient(
        transparent 0deg,
        transparent 300deg,
        var(--accent) 340deg,
        #ffffff 360deg
      );
      animation: rotate-beam 5s linear infinite;
      z-index: 0;
    }

    .card-inner {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 40px;
      z-index: 1;
      min-height: 300px;
    }

    @keyframes rotate-beam {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <section class="hero">
    <h1>Alles was du brauchst. Nichts was du nicht willst.</h1>
    <p>Erlebe maximale Performance, Anpassbarkeit und ein modernes Design für dein Gameplay.</p>
    <a href="#" class="btn-primary">Jetzt Starten</a>
  </section>

  <div class="card-container">
    <div class="card-inner">
      <h2>Launcher Vorschau</h2>
      <p style="color: #888; margin-top: 10px;">Interaktive Card mit dynamischem Border-Beam-Effekt.</p>
    </div>
  </div>

</body>
</html>
